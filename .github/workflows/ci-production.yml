name: PRIME Production CI

on:
  push:
    branches: [main, feature/production-architecture]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-prod.txt
      - name: Compile Python
        run: python -m py_compile server_prod.py test_production_api.py migrations/env.py migrations/versions/0001_initial.py
      - name: Run tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -f Dockerfile.production -t prime:test .
