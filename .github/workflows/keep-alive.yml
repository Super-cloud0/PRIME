name: Keep PRIME awake

# Render's free web-service tier spins the server down after ~15 minutes of
# no incoming requests, so the first real user after a gap eats a 30-60s
# cold start (and, combined with the account's current lack of a paid plan,
# that's the single biggest source of "the site won't load" complaints).
# This workflow is the free workaround: ping the health endpoint often
# enough that Render never sees 15 idle minutes. GitHub Actions scheduled
# runs are free on public repos, so this costs nothing.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health so Render never spins down
        run: curl -fsS --max-time 60 "https://prime-dmvj.onrender.com/health" || echo "ping failed (server may be mid-restart) -- not fatal, next run retries in 10 min"
