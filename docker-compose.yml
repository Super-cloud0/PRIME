services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: prime
      POSTGRES_USER: prime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prime -d prime"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://prime:${POSTGRES_PASSWORD}@db:5432/prime
      PRIME_JWT_SECRET: ${PRIME_JWT_SECRET:?set PRIME_JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      PRIME_MEDIA_ROOT: /app/media
    ports:
      - "8765:8765"
    volumes:
      - prime_media:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  prime_media:
