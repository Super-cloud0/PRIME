services:
  - type: web
    name: prime-mini-app
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prime-db
          property: connectionString
      - key: PRIME_JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: PRIME_MEDIA_ROOT
        value: /app/media
      - key: TELEGRAM_AUTH_MAX_AGE
        value: "86400"
    disk:
      name: prime-media
      mountPath: /app/media
      sizeGB: 10

databases:
  - name: prime-db
    plan: basic-256mb
    databaseName: prime
    user: prime
