<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>PRIME · Admin</title>
<style>
  :root{--bg:#060606;--card:#0f0f0f;--card2:#0b0b0b;--line:#242424;--text:#f5f3f1;--muted:#777;--red:#ff383e;--red2:#b50f17;--green:#3ddc73}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
  body{min-height:100vh}
  .wrap{max-width:760px;margin:0 auto;padding:24px 18px 60px}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
  .logo{font-size:22px;font-style:italic;font-weight:900;letter-spacing:-1px}
  .logo::first-letter{color:var(--red)}
  .logo small{display:block;font-style:normal;font-size:10px;letter-spacing:1.5px;color:var(--muted);font-weight:700}
  #refreshBtn{background:#111;color:#ddd;border:1px solid #2c2c2c;border-radius:10px;padding:9px 14px;font-size:12px;font-weight:700;cursor:pointer}
  #refreshBtn:disabled{opacity:.5;cursor:default}

  .gate{max-width:340px;margin:80px auto;text-align:center}
  .gate h1{font-size:20px;margin:0 0 6px}
  .gate p{color:var(--muted);font-size:12px;margin:0 0 18px}
  .gate input{width:100%;padding:13px;border-radius:10px;border:1px solid #292929;background:#0b0b0b;color:#fff;outline:none;font-size:14px;margin-bottom:10px}
  .gate input:focus{border-color:#7a252b}
  .gate button{width:100%;padding:13px;border-radius:10px;border:0;font-weight:900;color:#fff;background:linear-gradient(135deg,#ff454b,#cf1d26);cursor:pointer;font-size:13px}
  .gate .err{color:var(--red);font-size:11px;margin-top:10px;min-height:14px}

  .hidden{display:none!important}

  .note{font-size:10px;color:var(--muted);line-height:1.5;margin:0 0 18px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card2)}

  .funnel{display:flex;flex-direction:column;gap:0;margin-bottom:22px}
  .stage{position:relative;border:1px solid var(--line);background:linear-gradient(145deg,var(--card),var(--card2));border-radius:14px;padding:16px;margin-bottom:2px}
  .stage-head{display:flex;justify-content:space-between;align-items:baseline}
  .stage-name{font-size:11px;font-weight:800;letter-spacing:.03em;color:#ccc;text-transform:uppercase}
  .stage-total{font-size:32px;font-weight:900;letter-spacing:-1px;color:var(--red)}
  .stage-sub{display:flex;gap:16px;margin-top:8px;font-size:10px;color:var(--muted)}
  .stage-sub b{color:#ccc;font-weight:800}
  .stage-bar{height:6px;border-radius:99px;background:#1c1c1c;margin-top:12px;overflow:hidden}
  .stage-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#771218,#ff4045)}
  .arrow{text-align:center;color:var(--muted);font-size:11px;padding:6px 0;display:flex;align-items:center;justify-content:center;gap:8px}
  .arrow .pct{color:var(--green);font-weight:900}

  .card{border:1px solid var(--line);background:linear-gradient(145deg,var(--card),var(--card2));border-radius:15px;padding:16px;margin-bottom:16px}
  .section-title{font-size:12px;font-weight:800;letter-spacing:.02em;color:#ccc;margin-bottom:10px;display:flex;justify-content:space-between}
  .section-title small{color:var(--muted);font-weight:600;font-size:10px}
  .legend{display:flex;gap:14px;font-size:10px;color:var(--muted);margin-top:10px}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:8px;height:8px;border-radius:2px;display:inline-block}

  .status{font-size:11px;color:var(--muted);text-align:center;padding:30px 0}
  canvas{display:block;width:100%}

  .growth-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  .growth-item{border:1px solid var(--line);background:var(--card2);border-radius:11px;padding:12px 10px;text-align:center}
  .growth-item b{display:block;font-size:22px;font-weight:900;color:#8a5cff;letter-spacing:-.5px}
  .growth-item span{display:block;font-size:9px;color:var(--muted);margin-top:4px;line-height:1.35}
  .channel-list{display:flex;flex-wrap:wrap;gap:8px;font-size:10px;color:var(--muted)}
  .channel-list b{color:#ccc;font-weight:800}
  .channel-chip{border:1px solid var(--line);background:var(--card2);border-radius:99px;padding:5px 11px}
  .growth-empty{font-size:11px;color:var(--muted);text-align:center;padding:10px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">PRIME<small>ADMIN &middot; ФУНКЦИЯ АКТИВАЦИИ</small></div>
    <button id="refreshBtn" class="hidden">⟳ Обновить</button>
  </div>

  <div id="gate" class="gate">
    <h1>Вход в админку</h1>
    <p>Введи ключ администратора (ADMIN_SECRET на сервере)</p>
    <input id="keyInput" type="password" placeholder="Ключ доступа" autocomplete="off">
    <button id="enterBtn">Войти</button>
    <div class="err" id="gateErr"></div>
  </div>

  <div id="content" class="hidden">
    <div class="note" id="trackingNote"></div>

    <div class="funnel" id="funnel"></div>

    <div class="card">
      <div class="section-title"><span>Динамика по дням</span><small id="chartRange"></small></div>
      <canvas id="chart" height="220"></canvas>
      <div class="legend">
        <span><i style="background:#555"></i>Контакты с ботом</span>
        <span><i style="background:#ff383e"></i>Регистрации</span>
        <span><i style="background:#3ddc73"></i>Активации</span>
        <span><i style="background:#8a5cff"></i>Рефералы</span>
      </div>
    </div>

    <div class="card">
      <div class="section-title"><span>Рост &middot; рефералка и шеринг</span></div>
      <div id="growthStats"></div>
    </div>

    <div id="genTime" class="note"></div>
  </div>

  <div id="status" class="status hidden"></div>
</div>

<script>
(function () {
  const STORAGE_KEY = "prime_admin_key";
  const $ = (id) => document.getElementById(id);

  function fmt(n) { return new Intl.NumberFormat("ru-RU").format(n); }

  async function fetchFunnel(key) {
    const res = await fetch("/api/admin/funnel", { headers: { "X-Admin-Secret": key }, cache: "no-store" });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Ошибка ${res.status}`);
    return data;
  }

  function renderStage(name, stage, prevTotal) {
    const pctOfPrev = prevTotal ? Math.round((stage.total / prevTotal) * 100) : 100;
    return `
      <div class="stage">
        <div class="stage-head">
          <div class="stage-name">${name}</div>
          <div class="stage-total">${fmt(stage.total)}</div>
        </div>
        <div class="stage-sub">
          <span>7 дней: <b>${fmt(stage.last7d)}</b></span>
          <span>30 дней: <b>${fmt(stage.last30d)}</b></span>
        </div>
        <div class="stage-bar"><i style="width:${pctOfPrev}%"></i></div>
      </div>`;
  }

  function renderFunnel(data) {
    const s = data.stages;
    const c = data.conversion;
    $("funnel").innerHTML = [
      renderStage("Контакты с ботом", s.bot_contacts, null),
      `<div class="arrow">конверсия в регистрацию &nbsp;<span class="pct">${c.contact_to_register ?? "—"}%</span></div>`,
      renderStage("Регистрации", s.registrations, s.bot_contacts.total),
      `<div class="arrow">конверсия в активацию &nbsp;<span class="pct">${c.register_to_activate ?? "—"}%</span></div>`,
      renderStage("Активации (1+ анализ фото)", s.activations, s.registrations.total),
    ].join("");

    $("trackingNote").textContent =
      "Контакты с ботом считаются только с момента установки этой фичи — исторические данные до неё недоступны.";

    const gen = new Date(data.generated_at);
    $("genTime").textContent = "Обновлено: " + gen.toLocaleString("ru-RU");
  }

  const CHANNEL_LABELS = { telegram: "Telegram", download: "Скачать", native: "Системный шеринг", copy: "Копировать", unknown: "Другое" };

  function renderGrowth(growth) {
    if (!growth) { $("growthStats").innerHTML = `<div class="growth-empty">Нет данных</div>`; return; }
    const g = growth;
    const registeredPct = g.referral_to_register_pct != null ? ` (${g.referral_to_register_pct}%)` : "";
    const channels = Object.entries(g.share_clicks_by_channel || {}).sort((a, b) => b[1] - a[1]);
    const channelHtml = channels.length
      ? `<div class="channel-list">${channels.map(([key, n]) => `<span class="channel-chip"><b>${fmt(n)}</b> ${CHANNEL_LABELS[key] || key}</span>`).join("")}</div>`
      : `<div class="growth-empty">Пока никто не нажимал "поделиться"</div>`;
    $("growthStats").innerHTML = `
      <div class="growth-grid">
        <div class="growth-item"><b>${fmt(g.referrals.total)}</b><span>переходы по рефералке (7д: ${fmt(g.referrals.last7d)})</span></div>
        <div class="growth-item"><b>${fmt(g.referred_registered)}${registeredPct}</b><span>из них зарегистрировались</span></div>
        <div class="growth-item"><b>${fmt(g.share_clicks.total)}</b><span>клики "поделиться" (7д: ${fmt(g.share_clicks.last7d)})</span></div>
      </div>
      ${channelHtml}`;
  }

  function drawChart(daily) {
    const canvas = $("chart");
    const cssWidth = canvas.parentElement.clientWidth || 320;
    const cssHeight = 220;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = cssWidth * dpr;
    canvas.height = cssHeight * dpr;
    canvas.style.height = cssHeight + "px";
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, cssWidth, cssHeight);

    const padL = 28, padR = 4, padT = 10, padB = 26;
    const plotW = cssWidth - padL - padR;
    const plotH = cssHeight - padT - padB;
    const n = daily.length;
    if (!n) return;

    const order = ["bot_contacts", "registrations", "activations", "referrals"];
    const maxVal = Math.max(1, ...daily.map(d => Math.max(...order.map(k => d[k] || 0))));
    const stepX = n > 1 ? plotW / n : plotW;
    const barW = Math.max(2, stepX * 0.18);

    // gridlines + y labels
    ctx.strokeStyle = "#1c1c1c";
    ctx.fillStyle = "#666";
    ctx.font = "9px Inter, Arial, sans-serif";
    ctx.textAlign = "right";
    const ySteps = 4;
    for (let i = 0; i <= ySteps; i++) {
      const y = padT + plotH - (plotH * i) / ySteps;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(cssWidth - padR, y); ctx.stroke();
      ctx.fillText(String(Math.round((maxVal * i) / ySteps)), padL - 6, y + 3);
    }

    const seriesColor = { bot_contacts: "#555", registrations: "#ff383e", activations: "#3ddc73", referrals: "#8a5cff" };

    daily.forEach((d, i) => {
      const groupX = padL + i * stepX + (stepX - barW * order.length) / 2;
      order.forEach((key, j) => {
        const val = d[key] || 0;
        const h = (val / maxVal) * plotH;
        ctx.fillStyle = seriesColor[key];
        ctx.fillRect(groupX + j * barW, padT + plotH - h, barW - 1, h);
      });
    });

    // x labels: first, middle, last date only (avoid clutter)
    ctx.fillStyle = "#666";
    ctx.textAlign = "center";
    [0, Math.floor((n - 1) / 2), n - 1].forEach((idx) => {
      if (idx < 0 || idx >= n) return;
      const label = daily[idx].date.slice(5); // MM-DD
      const x = padL + idx * stepX + stepX / 2;
      ctx.fillText(label, x, cssHeight - 8);
    });
  }

  function showStatus(text) {
    $("status").textContent = text;
    $("status").classList.toggle("hidden", !text);
  }

  async function load(key) {
    showStatus("Загрузка…");
    $("content").classList.add("hidden");
    try {
      const data = await fetchFunnel(key);
      renderFunnel(data);
      renderGrowth(data.growth);
      $("chartRange").textContent = `последние ${data.daily.length} дн.`;
      drawChart(data.daily);
      $("content").classList.remove("hidden");
      $("refreshBtn").classList.remove("hidden");
      showStatus("");
      return true;
    } catch (e) {
      showStatus("");
      return e;
    }
  }

  async function tryEnter(key, fromStorage) {
    const result = await load(key);
    if (result === true) {
      try { localStorage.setItem(STORAGE_KEY, key); } catch (e) {}
      $("gate").classList.add("hidden");
      return;
    }
    if (fromStorage) {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      return;
    }
    $("gateErr").textContent = result.message || "Не удалось войти";
  }

  $("enterBtn").addEventListener("click", () => {
    const key = $("keyInput").value.trim();
    if (!key) return;
    $("gateErr").textContent = "";
    tryEnter(key, false);
  });
  $("keyInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("enterBtn").click(); });

  $("refreshBtn").addEventListener("click", () => {
    let key = "";
    try { key = localStorage.getItem(STORAGE_KEY) || ""; } catch (e) {}
    if (key) load(key);
  });

  window.addEventListener("resize", () => {
    let key = "";
    try { key = localStorage.getItem(STORAGE_KEY) || ""; } catch (e) {}
    if (key && !$("content").classList.contains("hidden")) load(key);
  });

  (function bootstrap() {
    let saved = "";
    try { saved = localStorage.getItem(STORAGE_KEY) || ""; } catch (e) {}
    if (saved) {
      $("keyInput").value = saved;
      tryEnter(saved, true);
    }
  })();
})();
</script>
</body>
</html>
